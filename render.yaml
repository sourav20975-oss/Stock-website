services:
  # ─────────────────────────────────────────────
  #  BACKEND — Node.js / Express API Server
  # ─────────────────────────────────────────────
  - type: web
    name: stock-knowledge-api
    env: node
    region: singapore
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GNEWS_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ANGEL_API_KEY
        sync: false
      - key: ANGEL_CLIENT_ID
        sync: false
      - key: ANGEL_TOTP_SECRET
        sync: false
    healthCheckPath: /api/health

  # ─────────────────────────────────────────────
  #  FRONTEND — Vite / React Static Site
  # ─────────────────────────────────────────────
  - type: web
    name: stock-knowledge-client
    env: static
    region: singapore
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://stock-knowledge-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
